name: Deploy Blog Microservices to ECS Fargate

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger from GitHub UI

env:
  AWS_REGION:   ap-south-1
  ECR_REGISTRY: 329668418627.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  # ── JOB 1: Build + Push all 3 Docker images to ECR ───────────────────────
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      frontend_image: ${{ steps.fe.outputs.image }}
      auth_image:     ${{ steps.auth.outputs.image }}
      blog_image:     ${{ steps.blog.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build + push frontend
        id: fe
        run: |
          IMG=${{ env.ECR_REGISTRY }}/blog-app/frontend:${{ github.sha }}
          docker build \
            --build-arg REACT_APP_API_URL=https://ecs.${{ secrets.TF_VAR_domain_name }} \
            -t $IMG ./frontend
          docker push $IMG
          echo "image=$IMG" >> $GITHUB_OUTPUT

      - name: Build + push auth-service
        id: auth
        run: |
          IMG=${{ env.ECR_REGISTRY }}/blog-app/auth-service:${{ github.sha }}
          docker build -t $IMG ./backend/auth-service
          docker push $IMG
          echo "image=$IMG" >> $GITHUB_OUTPUT

      - name: Build + push blog-service
        id: blog
        run: |
          IMG=${{ env.ECR_REGISTRY }}/blog-app/blog-service:${{ github.sha }}
          docker build -t $IMG ./backend/blog-service
          docker push $IMG
          echo "image=$IMG" >> $GITHUB_OUTPUT

  # ── JOB 2: Terraform apply ────────────────────────────────────────────────
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform init + apply
        working-directory: terraform/cluster
        env:
          TF_VAR_mongodb_url:    ${{ secrets.TF_VAR_mongodb_url }}
          TF_VAR_secret_key:     ${{ secrets.TF_VAR_secret_key }}
          TF_VAR_domain_name:    ${{ secrets.TF_VAR_domain_name }}
          TF_VAR_subdomain:      ${{ secrets.TF_VAR_subdomain }}
          TF_VAR_frontend_image: ${{ needs.build.outputs.frontend_image }}
          TF_VAR_auth_image:     ${{ needs.build.outputs.auth_image }}
          TF_VAR_blog_image:     ${{ needs.build.outputs.blog_image }}
        run: |
          terraform init
          terraform apply -auto-approve

  # ── JOB 3: Force ECS to pick up new images ────────────────────────────────
  deploy:
    name: Force ECS Redeploy
    runs-on: ubuntu-latest
    needs: [build, terraform]

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Force redeploy all 3 services
        run: |
          CLUSTER=blog-app-cluster
          aws ecs update-service --cluster $CLUSTER --service frontend     --force-new-deployment --region ${{ env.AWS_REGION }}
          aws ecs update-service --cluster $CLUSTER --service auth-service --force-new-deployment --region ${{ env.AWS_REGION }}
          aws ecs update-service --cluster $CLUSTER --service blog-service --force-new-deployment --region ${{ env.AWS_REGION }}
          aws ecs wait services-stable \
            --cluster $CLUSTER \
            --services frontend auth-service blog-service \
            --region ${{ env.AWS_REGION }}
          echo "All 3 services are live!"
          echo "URL: https://ecs.${{ secrets.TF_VAR_domain_name }}"